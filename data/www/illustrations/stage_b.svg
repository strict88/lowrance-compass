<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Stage B illustrations, referenced by guide_content.json's illustration_svg_id
       via <use href="illustrations/stage_b.svg#<id>">. 0 0 120 120 viewBox,
       currentColor strokes so they inherit the page's theme. -->

  <symbol id="stage_b_step1" viewBox="0 0 120 120">
    <!-- boat hull, waterline, and a level bubble -->
    <path d="M15 85 Q60 100 105 85 L95 70 L25 70 Z" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="5" y1="90" x2="115" y2="90" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="60" cy="45" r="20" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="60" cy="45" r="4" fill="currentColor"/>
    <line x1="40" y1="45" x2="80" y2="45" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <symbol id="stage_b_step2" viewBox="0 0 120 120">
    <!-- compass rose with a bearing arrow, and a GPS/satellite alt icon -->
    <circle cx="60" cy="60" r="35" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="60" y1="60" x2="60" y2="25" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 25 l-6 12 l12 0 Z" fill="currentColor"/>
    <line x1="60" y1="60" x2="85" y2="40" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="60" y="112" text-anchor="middle" font-size="12" fill="currentColor" font-family="sans-serif">N</text>
  </symbol>
</svg>
