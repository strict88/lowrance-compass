; PlatformIO Project Configuration File
;
; Environments:
;   esp32s3       - real firmware, flashed to the device (ESP32-S3-N16R8)
;   esp32s3_bench - esp32s3 plus BENCH_MODE (TWAI self-test/no-ACK) and
;                   DEBUG_GPS_INJECT (POST /api/debug/gps-inject, quickstart.md
;                   section 6) for bench testing without a real N2K bus/GPS.
;                   Never flash this build for on-water use.
;   esp32s3_test  - on-target Unity tests (test/esp32s3/)
;   native        - host-side Unity tests for pure-logic modules (test/native/)
;
; Every dependency below is pinned to an exact version/commit per the project
; constitution's "no floating versions" rule (see specs/001-calibration-guided-setup/research.md).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_flags =
    -Wall
    -Wextra
    -Werror
    -std=gnu++17
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
; esp32s3 - real firmware
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino

; esp32-s3-devkitc-1 board def defaults to the N8 variant (8MB flash, no
; PSRAM); override for the actual N16R8 hardware (16MB flash, 8MB Octal PSRAM).
; `arduino.memory_type` (not just `psram_type`) is what actually selects the
; Arduino framework's flash+PSRAM SPI line mode -- confirmed against the
; platform's own official N16R8 board def (boards/esp32-s3-devkitc1-n16r8.json),
; which sets memory_type=qio_opi alongside psram_type=opi. Without it, PSRAM
; init fails at boot ("wrong PSRAM line mode") and the device crash-loops
; before ever reaching setup()/Wi-Fi.
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb_ota.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
; Not native-USB-CDC (this board's only accessible serial path is the
; external CH343 UART bridge on the classic UART0 pins, confirmed by
; diagnosis: ROM/ESP-IDF boot messages show on it, but nothing app-level
; ever did, because ARDUINO_USB_CDC_ON_BOOT=1 was redirecting Arduino's
; Serial to native USB CDC, which isn't wired to any connector on this
; board). Leaving usb_mode/CDC_ON_BOOT unset routes Serial to UART0 instead.
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
build_unflags = ${common.build_unflags}

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; NMEA2000 is vendored in lib/NMEA2000 at a pinned commit (see
; lib/NMEA2000/PINNED_COMMIT.md) rather than listed here, because
; GitHub refuses PlatformIO's shallow fetch of an arbitrary commit SHA.
lib_deps =
    adafruit/Adafruit BNO08x @ 1.2.7
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------------------
; esp32s3_bench - bench testing only (self-test CAN bus + debug GPS inject)
; ---------------------------------------------------------------------------
[env:esp32s3_bench]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DBENCH_MODE=1
    -DDEBUG_GPS_INJECT=1

; ---------------------------------------------------------------------------
; esp32s3_test - on-target Unity tests
; ---------------------------------------------------------------------------
[env:esp32s3_test]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity

board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb_ota.csv
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DUNIT_TEST
build_unflags = ${common.build_unflags}

test_build_src = true
; Each on-target test file defines its own setup()/loop() (Unity's runner);
; excluding main.cpp avoids a "multiple definition of setup()/loop()" link
; error against the production entry point while still linking every other
; driver/service class the tests need.
build_src_filter =
    +<*>
    -<main.cpp>
test_filter = esp32s3/*

monitor_speed = 115200

; NMEA2000 is vendored in lib/NMEA2000 at a pinned commit; see
; lib/NMEA2000/PINNED_COMMIT.md.
lib_deps =
    adafruit/Adafruit BNO08x @ 1.2.7
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------------------
; native - host-side Unity tests, zero hardware dependencies
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Iinclude
    -Isrc
    -DUNIT_TEST
    -DNATIVE_BUILD
build_src_filter =
    +<heading/>
    +<calibration/>
    +<n2k_codec/>
    +<settings/>
    +<guide/>
    +<drivers/kv_store/record_envelope.cpp>
    +<services/calibration_service.cpp>
    +<services/settings_service.cpp>
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
test_filter = native/*
