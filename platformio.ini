; PlatformIO Project Configuration File
;
; Environments:
;   esp32s3       - real firmware, flashed to the device (ESP32-S3-N16R8)
;   esp32s3_test  - on-target Unity tests (test/esp32s3/)
;   native        - host-side Unity tests for pure-logic modules (test/native/)
;
; Every dependency below is pinned to an exact version/commit per the project
; constitution's "no floating versions" rule (see specs/001-calibration-guided-setup/research.md).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
build_flags =
    -Wall
    -Wextra
    -Werror
    -std=gnu++17
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
; esp32s3 - real firmware
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino

; esp32-s3-devkitc-1 board def defaults to the N8 variant (8MB flash, no
; PSRAM); override for the actual N16R8 hardware (16MB flash, 8MB Octal PSRAM)
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb_ota.csv
board_build.psram_type = opi
board_build.filesystem = littlefs
board_build.arduino.usb_mode = 1
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = ${common.build_unflags}

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; NMEA2000 is vendored in lib/NMEA2000 at a pinned commit (see
; lib/NMEA2000/PINNED_COMMIT.md) rather than listed here, because
; GitHub refuses PlatformIO's shallow fetch of an arbitrary commit SHA.
lib_deps =
    adafruit/Adafruit BNO08x @ 1.2.7
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------------------
; esp32s3_test - on-target Unity tests
; ---------------------------------------------------------------------------
[env:esp32s3_test]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity

board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb_ota.csv
board_build.psram_type = opi
board_build.filesystem = littlefs
board_build.arduino.usb_mode = 1
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUNIT_TEST
build_unflags = ${common.build_unflags}

test_build_src = true
test_filter = esp32s3/*

monitor_speed = 115200

; NMEA2000 is vendored in lib/NMEA2000 at a pinned commit; see
; lib/NMEA2000/PINNED_COMMIT.md.
lib_deps =
    adafruit/Adafruit BNO08x @ 1.2.7
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    ESP32Async/AsyncTCP @ 3.5.0
    bblanchon/ArduinoJson @ 7.4.3

; ---------------------------------------------------------------------------
; native - host-side Unity tests, zero hardware dependencies
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Iinclude
    -Isrc
    -DUNIT_TEST
    -DNATIVE_BUILD
build_src_filter =
    +<heading/>
    +<calibration/>
    +<n2k_codec/>
    +<settings/>
    +<guide/>
    +<drivers/kv_store/record_envelope.cpp>
    +<services/calibration_service.cpp>
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
test_filter = native/*
